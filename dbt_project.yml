name: jaffle_shop_1

profile: jaffle_shop_1

seed-paths: ["data"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  jaffle_shop_1:
    perakende_satis:
      +file_format: csv
    sales_data:
      +file_format: csv

models:
  jaffle_shop_1:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: table
